<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>The Shy Geometry - Interaction</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
        }
      }
    </script>
    <style>
      body { margin: 0; overflow: hidden; background-color: #1a1a1a; } /* Darker background outside canvas */
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #ffffff;
        font-family: sans-serif;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        pointer-events: none;
      }
      h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
      p { margin: 5px 0; font-size: 16px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>The Shy Geometry</h1>
      <p>Try to move your mouse over the sphere...</p>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
